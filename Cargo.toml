[package]
name = "lg-translate"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
serde_json = "1"
tokenizers = "0.23.1"
unicode-width = "0.2"
# Setup-only HTTP. rustls keeps the build free of a system OpenSSL.
ureq = { version = "3", default-features = false, features = ["rustls"] }

# Keep the Candle crates on the same revision/API.
candle-core = { git = "https://github.com/huggingface/candle.git", package = "candle-core" }
candle-nn = { git = "https://github.com/huggingface/candle.git", package = "candle-nn" }
candle-transformers = { git = "https://github.com/huggingface/candle.git", package = "candle-transformers" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
